name: Import template asset

# One-off: download a finished template file (e.g. the Higgsfield footage plate) from a URL
# and commit it into the repo. Started by hand or by Claude via workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'HTTPS URL of the file'
        required: true
      path:
        description: 'Where to save it in the repo (e.g. kit/assets/plate.mp4)'
        required: true
      sha256:
        description: 'Expected SHA-256 of the file (optional)'
        required: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download and check
        env:
          URL: ${{ inputs.url }}
          DEST: ${{ inputs.path }}
          SUM: ${{ inputs.sha256 }}
        run: |
          case "$URL" in https://*) ;; *) echo "::error::URL must be https"; exit 1;; esac
          case "$DEST" in kit/assets/*) ;; *) echo "::error::path must be under kit/assets/"; exit 1;; esac
          mkdir -p "$(dirname "$DEST")"
          curl -fL --retry 3 -o "$DEST" "$URL"
          ls -la "$DEST"
          if [ -n "$SUM" ]; then echo "$SUM  $DEST" | sha256sum -c -; fi

      - name: Commit
        env:
          DEST: ${{ inputs.path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "Import template asset $DEST"
          git push
